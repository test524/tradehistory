# Render Blueprint: one web service serves the API and the built web app.
services:
  - type: web
    name: tradehistory
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22
